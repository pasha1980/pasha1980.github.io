---
layout: default
---
<article class="blog-post">
  <section class="panel">
    <div class="panel-header">Blog post</div>
    <div class="panel-body">
      <header class="post-header">
        <h1>{{ page.title }}</h1>
        <div class="post-meta">
          <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y-%m-%d' }}</time>
          {% for tag in page.tags %}
            {% assign project = site.projects | where: 'slug', tag | first %}
            {% if project %}
              &middot; <a href="{{ project.url | relative_url }}" class="tag">{{ project.title }}</a>
            {% else %}
              &middot; <span class="tag tag-muted">{{ tag }}</span>
            {% endif %}
          {% endfor %}
        </div>
      </header>
      {{ content }}
    </div>
  </section>
</article>
