url: "https://pasha1980.github.io"
author: Pavel Khvalygin
twitter:
  username: pasha1980
  card: summary

# Navigation
navigation:
  - title: Home
    url: /
  - title: Blog
    url: /blog/
  - title: Projects
    url: /projects/
  - title: About
    url: /about/
  - title: Contact
    url: /contact/

# Projects
projects:
  - title: "Home AI (and not only) lab"
    slug: home-ai-lab
    url: /projects/home-ai-lab/
    description: "Homelab for AI inference, gaming, storage, and experiments."
  - title: "TTY Space Program"
    slug: tsp
    url: /projects/tsp/
    description: "Kerbal Space Program in the terminal, written in Bash."
  - title: "LangBench"
    slug: langbench
    url: /projects/langbench/
    description: "Benchmarks born from a dispute about Go vs PHP and JavaScript."
  - title: "CloudOpt"
    slug: cloudopt
    url: /projects/cloudopt/
    description: "A local, read-only cloud cost optimization analyzer for AWS and GCP."

# Build settings
theme: minima
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-last-modified-at

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
